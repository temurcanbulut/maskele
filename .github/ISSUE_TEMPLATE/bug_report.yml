name: Bug report
description: A reproducible problem with masking, restoration or an interface.
body:
  - type: markdown
    attributes:
      value: Use synthetic examples only. Report security vulnerabilities privately through SECURITY.md.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and synthetic input
      description: Include the command or interface, configuration and a minimal invented example.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Maskele, Python and operating system versions
    validations:
      required: true
