name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: New release tag (exact tested main source; no existing assets replaced)
        required: true
        type: string
  push:
    tags: ['v*']
env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate release tag
        run: python -c "import os,re; assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[a-z0-9]+(?:\.[a-z0-9]+)*)?', os.environ['RELEASE_TAG'])"
      - name: Require green exact-source CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/require_green_ci.py
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Validate tag matches package
        run: python -c "import os,maskele; assert os.environ['RELEASE_TAG'] == 'v'+maskele.__version__"
      - run: cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-bundle
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-bundle
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          files: dist/*
          body: 'Security defaults: tool/URL/secret restore restrictions, one-use local UI launch, encrypted persistence. Read CHANGELOG.md and docs/SECURITY_REVIEW_2026-11.md before upgrading.'
      - name: Publish complete draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit --draft=false -- "$RELEASE_TAG"
