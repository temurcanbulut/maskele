[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maskele"
version = "0.4.2"
description = "LLM'e göndermeden önce hassas veriyi maskele, cevabı geri çevir. CLI, OpenAI/Anthropic proxy'si ve yerel arayüz; TCKN, VKN, IBAN, plaka ve Türkçe isim desteği."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Temur Can Bulut" }]
keywords = ["llm", "privacy", "kvkk", "gdpr", "pii", "redaction", "pseudonymization",
            "openai", "anthropic", "proxy", "security", "tckn"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Natural Language :: Turkish",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.optional-dependencies]
crypto = ["cryptography>=42"]
dev = ["pytest>=8", "cryptography>=42", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/temurcanbulut/maskele"
Issues = "https://github.com/temurcanbulut/maskele/issues"
Changelog = "https://github.com/temurcanbulut/maskele/blob/main/CHANGELOG.md"

[project.scripts]
maskele = "maskele.cli:main"

[tool.setuptools]
packages = ["maskele", "maskele.web"]

[tool.setuptools.package-data]
maskele = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S310", "S603", "S607", "E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/scenes.py" = ["E501"]  # SVG coordinates and fixed illustration copy
